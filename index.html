<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Only Free</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: #0b0b0c; 
            color: #ffffff; 
            padding-bottom: 90px; 
            overflow-x: hidden;
        }

        /* Cabecera Elegante */
        header { 
            background: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(12px);
            padding: 16px; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            text-align: center; 
        }

        header h1 { 
            font-size: 1.3rem; 
            font-weight: 800;
            color: #ff2a74; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255, 42, 116, 0.4);
        }

        /* Contenedor Principal */
        .main-container { 
            max-width: 500px; 
            margin: 0 auto; 
            padding: 15px 12px; 
        }

        /* 1. SECCIÓN DESTACADA (La última chica subida) */
        .featured-card {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 42, 116, 0.3);
            box-shadow: 0 8px 25px rgba(255, 42, 116, 0.15);
            background-color: #16161a;
        }

        .featured-img-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            position: relative;
        }

        .featured-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .featured-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 15px 15px 15px;
            background: linear-gradient(180deg, transparent 0%, rgba(11, 11, 12, 0.95) 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .featured-info .badge {
            background: rgba(255, 42, 116, 0.2);
            color: #ff2a74;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 42, 116, 0.3);
            display: inline-block;
            margin-bottom: 4px;
        }

        .featured-info .name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .featured-btn {
            background: linear-gradient(45deg, #ff2a74, #ff5e97);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(255, 42, 116, 0.4);
            transition: transform 0.2s;
        }

        .featured-btn:active {
            transform: scale(0.95);
        }

        /* 2. REJILLA DEL FEED (2 Columnas elegantes) */
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .grid-card {
            background-color: #16161a;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #232329;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .grid-card:active {
            transform: scale(0.96);
        }

        .grid-img-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #000;
            position: relative;
        }

        .grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .grid-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 25px 8px 8px 8px;
            background: linear-gradient(180deg, transparent 0%, rgba(11, 11, 12, 0.9) 100%);
        }

        .grid-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Barra de navegación inferior con cristal */
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            height: 65px; 
            background: rgba(17, 17, 21, 0.85); 
            backdrop-filter: blur(15px);
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            z-index: 999; 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }

        .nav-item { 
            color: #8a8a93; 
            text-decoration: none; 
            font-size: 0.75rem; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 25%;
            height: 100%;
            transition: color 0.2s;
        }

        .nav-icon {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .nav-item.active { 
            color: #ff2a74; 
            font-weight: bold; 
        }

        .nav-item:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <header>
        <h1>Tu Only Free</h1>
    </header>

    <main class="main-container">
        <!-- Chica Destacada -->
        <div id="featured-container"></div>

        <!-- Rejilla con el resto del catálogo -->
        <div class="feed-grid" id="feed-grid"></div>
    </main>

    <nav class="nav-bar">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="chicas.html" class="nav-item">
            <span class="nav-icon">🔥</span>
            <span>Mis Chicas</span>
        </a>
        <a href="buscar.html" class="nav-item">
            <span class="nav-icon">🔍</span>
            <span>Buscar</span>
        </a>
        <a href="info.html" class="nav-item">
            <span class="nav-icon">ℹ️</span>
            <span>Info</span>
        </a>
    </nav>

    <script src="db.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const featuredContainer = document.getElementById('featured-container');
            const feedGrid = document.getElementById('feed-grid');
            
            if (typeof modelosDB !== 'undefined' && Array.isArray(modelosDB) && modelosDB.length > 0) {
                // Copiamos e invertimos la lista para mostrar primero las más recientes
                const data = [...modelosDB].reverse(); 

                // 1. Renderizar la Chica Destacada (La primera del array invertido)
                const destacada = data[0];
                if (destacada && destacada.id) {
                    featuredContainer.innerHTML = `
                        <div class="featured-card">
                            <div class="featured-img-container">
                                <img src="${destacada.fotoPortada}" class="featured-img" alt="${destacada.nombre}">
                                <div class="featured-overlay">
                                    <div class="featured-info">
                                        <span class="badge">NUEVO PERFIL</span>
                                        <div class="name">${destacada.nombre}</div>
                                    </div>
                                    <a href="modelo.html?id=${destacada.id}" class="featured-btn">Ver Perfil</a>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // 2. Renderizar el resto de chicas en cuadrícula
                const restoModelos = data.slice(1);
                restoModelos.forEach(modelo => {
                    if (!modelo || !modelo.id) return;

                    const card = document.createElement('a');
                    card.className = 'grid-card';
                    card.href = `modelo.html?id=${modelo.id}`;
                    card.innerHTML = `
                        <div class="grid-img-container">
                            <img src="${modelo.fotoPortada}" class="grid-img" loading="lazy" alt="${modelo.nombre}">
                            <div class="grid-overlay">
                                <div class="grid-name">${modelo.nombre}</div>
                            </div>
                        </div>
                    `;
                    feedGrid.appendChild(card);
                });

            } else {
                feedGrid.innerHTML = "<p style='grid-column: span 2; text-align:center; padding:40px; color:#8a8a93;'>No se pudieron cargar los datos.</p>";
            }
        });
    </script>
</body>
</html>
